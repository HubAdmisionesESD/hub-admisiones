<script>
(function () {
  var modal = document.getElementById('toolsModal');
  var open = document.getElementById('openTools');
  var close = document.getElementById('closeTools');
  function show(v) { modal.hidden = !v; }
  open.addEventListener('click', function (e) { e.stopPropagation(); show(true); });
  close.addEventListener('click', function () { show(false); });
  modal.addEventListener('click', function (e) { if (e.target === modal) show(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') show(false); });
})();
</script>
